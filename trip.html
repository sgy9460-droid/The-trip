<style>:root{--navy:#1B2A4A;--navy-2:#243a63;--paper:#F3EFE6;--paper-2:#EAE4D6;--card:#FBF9F4;--ink:#242220;--ink-soft:#6b6558;--ochre:#C68A3D;--teal:#2F6F63;--teal-soft:#DCE9E5;--line:#D8D2C2;--danger:#B4483A;--radius:14px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;background:var(--navy);overscroll-behavior-y:none}body{font-family:Heebo,system-ui,sans-serif;color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;justify-content:center}#app{width:100%;max-width:520px;min-height:100vh;min-height:100dvh;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}header{background:var(--navy);color:var(--paper);padding:18px 20px 16px;border-radius:0 0 22px 22px;flex-shrink:0}.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.head-eyebrow{font-size:13px;color:#b9c3d6;margin:0 0 2px}.head-date{font-family:Frank Ruhl Libre,serif;font-weight:700;font-size:26px;margin:0;line-height:1.25}.bell-btn{background:#ffffff1f;border:1px solid rgba(255,255,255,.2);color:var(--paper);border-radius:999px;padding:9px 14px;font-size:13px;font-family:inherit;white-space:nowrap;flex-shrink:0}.bell-btn.on{background:var(--teal);border-color:var(--teal)}.day-strip{display:flex;gap:7px;margin-top:16px;overflow-x:auto;padding-bottom:2px}.day-pill{flex:1 0 auto;min-width:42px;background:transparent;border:1px solid rgba(255,255,255,.25);color:#cbd4e4;border-radius:12px;padding:8px 4px 7px;font-family:inherit;font-size:13px;text-align:center;position:relative}.day-pill .n{display:block;font-size:15px;font-weight:600;margin-top:2px}.day-pill.today{border-color:var(--ochre);color:#fff}.day-pill.selected{background:var(--paper);color:var(--navy);border-color:var(--paper)}.day-pill.selected .n{color:var(--navy)}.day-dot{position:absolute;top:6px;left:8px;width:5px;height:5px;border-radius:50%;background:var(--ochre)}.day-pill.sel <body>
<div id="app">
  <header>
    <div class="head-row">
      <div>
        <p class="head-eyebrow">הטיול שלי 🌴</p>
        <p class="head-date" id="tileSumTrip">—</p>
      </div>
    </div>
  </header>
  <main>
    <section class="panel open" data-panel="trip">
      <div class="sec-head">
        <h2 class="sec-title">הטיול 🌴</h2>
        <button class="sec-add" id="tripAddBtn" type="button">+ פריט</button>
      </div>
      <p class="sec-sub">ניו יורק, אורלנדו ומיאמי באותו אזור זמן. ההפרש מישראל כרגע: <span id="tripDiff"></span></p>
      <div class="trip-clocks">
        <div class="trip-clock"><div class="trip-clock-name">ארה״ב (מזרח)</div><div class="trip-clock-time" id="tripClockNY">--:--</div></div>
        <div class="trip-clock"><div class="trip-clock-name">ישראל</div><div class="trip-clock-time" id="tripClockIL">--:--</div></div>
      </div>
      <div class="now-card" id="tripNext" style="margin:0 0 12px;"></div>
      <div class="form-card" id="tripForm">
        <div class="chip-row" id="tripTypeRow" style="margin-bottom:10px;">
          <button class="chip sel" type="button" data-type="flight">✈️ טיסה</button>
          <button class="chip" type="button" data-type="hotel">🏨 מלון</button>
          <button class="chip" type="button" data-type="ticket">🎟️ כרטיס</button>
          <button class="chip" type="button" data-type="car">🚗 רכב</button>
          <button class="chip" type="button" data-type="other">📌 אחר</button>
        </div>
        <input type="text" id="tripTitle" placeholder="שם">
        <div class="time-row" style="margin-top:8px;">
          <div><input type="text" id="tripFrom" placeholder="מקום"></div>
          <div id="tripToWrap"><input type="text" id="tripTo" placeholder="יעד"></div>
        </div>
        <label id="tripStartLabel">מועד</label>
        <div class="time-row">
          <div><input type="date" id="tripDate"></div>
          <div><input type="time" id="tripTime"></div>
        </div>
        <select id="tripTz" class="trip-select"><option value="ET">שעון ארה״ב (מזרח)</option><option value="IL">שעון ישראל</option></select>
        <div id="tripEndWrap">
          <label id="tripEndLabel">סיום</label>
          <div class="time-row">
            <div><input type="date" id="tripEndDate"></div>
            <div><input type="time" id="tripEndTime"></div>
          </div>
          <select id="tripEndTz" class="trip-select"><option value="ET">שעון ארה״ב (מזרח)</option><option value="IL">שעון ישראל</option></select>
        </div>
        <label>קוד הזמנה (לא חובה)</label>
        <input type="text" id="tripCode" placeholder="למשל ABC123">
        <label>הערה (לא חובה)</label>
        <input type="text" id="tripNote" placeholder="טרמינל, מספר חדר, מה להביא">
        <p class="bulk-hint">שעת הטיסה נכתבת לפי שעון שדה התעופה, כמו שמופיע בכרטיס: המראה לפי שעון שדה היציאה, ונחיתה לפי שעון שדה היעד.</p>
        <div class="form-actions">
          <button class="btn-save" id="tripSaveBtn" type="button">שמירה</button>
          <button class="btn-cancel" id="tripCancelBtn" type="button">ביטול</button>
        </div>
      </div>
      <div id="tripTimeline"></div>
      <h3 class="sub-title">רשימת הכנות</h3>
      <div class="todo-list" id="tripChecks"></div>
      <div class="todo-quickadd" style="margin-top:8px;">
        <input type="text" id="tripCheckInput" placeholder="להוסיף לרשימה">
        <button id="tripCheckAdd" type="button">+</button>
      </div>
      <h3 class="sub-title">גיבוי הטיול</h3>
      <div class="backup-actions">
        <button id="tripExportBtn" type="button">ייצוא כטקסט</button>
        <button id="tripImportBtn" type="button">ייבוא</button>
      </div>
      <div class="backup-box open"><textarea id="tripBackupText" style="display:none;"></textarea></div>
    </section>

  </main>
</div>
<div class="toast" id="toast"></div>
<script>(function(){"use strict";
var KEY="tripplanner_v1";
var i=loadS();
function emptyTrip(){ return {items:[],checks:{},extra:[]}; }
function loadS(){
  try{ var r=localStorage.getItem(KEY); if(r){ var t=JSON.parse(r); if(!t.trip) t.trip=emptyTrip(); return t; } }catch(e){}
  try{ var m=JSON.parse(localStorage.getItem("dayplanner_v1")); if(m && m.trip && m.trip.items && m.trip.items.length) return {trip:m.trip}; }catch(e){}
  return {trip:emptyTrip()};
}
function h(){ try{ localStorage.setItem(KEY,JSON.stringify(i)); }catch(e){} try{ tripTile(); }catch(e){} }
function p(e){var t=document.getElementById("toast");t.textContent=e,t.classList.add("show"),clearTimeout(p._tm),p._tm=setTimeout(function(){t.classList.remove("show")},3200)}
function tripS(){ if(!i.trip) i.trip = { items:[], checks:{}, extra:[] }; if(!i.trip.items) i.trip.items = []; if(!i.trip.checks) i.trip.checks = {}; if(!i.trip.extra) i.trip.extra = []; return i.trip; }
function tripSave(){ h(); }
function tripToast(m){ p(m); }
var TRIP_TYPES = { flight:{ico:'✈️',name:'טיסה'}, hotel:{ico:'🏨',name:'מלון'}, ticket:{ico:'🎟️',name:'כרטיס/אטרקציה'}, car:{ico:'🚗',name:'רכב'}, other:{ico:'📌',name:'אחר'} };
var TRIP_DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
var TRIP_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
var TRIP_CHECKS = ['דרכון בתוקף לכל הנוסעים','אישור ESTA (או ויזה) לכל הנוסעים','ביטוח נסיעות','כרטיסי טיסה ואישורי מלונות שמורים גם בלי אינטרנט','כרטיס אשראי והודעה לבנק על הנסיעה','מטען, סוללה ניידת ומתאם לשקע אמריקאי','חבילת גלישה או eSIM','הזמנות לאטרקציות וקודי כניסה'];
var tripType = 'flight', tripEditId = null;
function tripZone(tz){ return tz === 'IL' ? 'Asia/Jerusalem' : 'America/New_York'; }
function tripZoneLabel(tz){ return tz === 'IL' ? 'שעון ישראל' : 'שעון ארה״ב (מזרח)'; }
function tripOffset(utcMs, zone){
  var f = new Intl.DateTimeFormat('en-US', { timeZone:zone, hourCycle:'h23', year:'numeric', month:'numeric', day:'numeric', hour:'numeric', minute:'numeric', second:'numeric' });
  var parts = {};
  f.formatToParts(new Date(utcMs)).forEach(function(x){ parts[x.type] = +x.value; });
  var asUTC = Date.UTC(parts.year, parts.month-1, parts.day, parts.hour, parts.minute, parts.second);
  return asUTC - Math.floor(utcMs/1000)*1000;
}
function tripToUTC(dateStr, timeStr, tz){
  if(!dateStr) return null;
  var d = dateStr.split('-'), t = (timeStr || '00:00').split(':');
  var guess = Date.UTC(+d[0], +d[1]-1, +d[2], +t[0], +t[1]);
  var zone = tripZone(tz);
  var res = guess - tripOffset(guess, zone);
  var off2 = tripOffset(res, zone);
  res = guess - off2;
  return res;
}
function tripFmtIn(ms, tz, withDate){
  var o = { timeZone: tripZone(tz), hourCycle:'h23', hour:'2-digit', minute:'2-digit' };
  if(withDate){ o.day = 'numeric'; o.month = 'numeric'; }
  return new Intl.DateTimeFormat('he-IL', o).format(new Date(ms));
}
function tripDateParts(s){ var d = s.split('-'); return new Date(+d[0], +d[1]-1, +d[2]); }
function tripDayDiff(a, b){ var x = a.split('-'), y = b.split('-'); return Math.round((Date.UTC(+y[0],+y[1]-1,+y[2]) - Date.UTC(+x[0],+x[1]-1,+x[2]))/86400000); }
function tripTodayStr(){ var d = new Date(); return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
function tripRemaining(ms){
  var d = Math.floor(ms/86400000), hh = Math.floor((ms%86400000)/3600000), mm = Math.floor((ms%3600000)/60000);
  if(d >= 2) return d + ' ימים' + (hh ? ' ו-' + hh + ' שעות' : '');
  if(d === 1) return 'יום' + (hh ? ' ו-' + hh + ' שעות' : '');
  if(hh > 0) return hh + ' שעות' + (mm ? ' ו-' + mm + ' דקות' : '');
  return mm + ' דקות';
}
function tripDurText(ms){
  var hh = Math.floor(ms/3600000), mm = Math.round((ms%3600000)/60000);
  return hh + ' ש׳' + (mm ? ' ' + mm + ' ד׳' : '');
}
function tripSorted(){
  return tripS().items.slice().sort(function(a,b){
    return (tripToUTC(a.date, a.time, a.tz) || 0) - (tripToUTC(b.date, b.time, b.tz) || 0);
  });
}
function tripEl(id){ return document.getElementById(id); }
function tripSetText(id, t){ var e = tripEl(id); if(e) e.textContent = t; }

function tripLabels(type){
  var L = {
    flight:{ title:'טיסה, למשל LY001', from:'משדה (למשל TLV)', to:'לשדה (למשל JFK)', start:'המראה', end:'נחיתה', toRow:true, endRow:true },
    hotel: { title:'שם המלון', from:'כתובת או עיר', to:'', start:'צ׳ק-אין', end:'צ׳ק-אאוט', toRow:false, endRow:true },
    car:   { title:'השכרת רכב', from:'מקום איסוף', to:'מקום החזרה', start:'איסוף', end:'החזרה', toRow:true, endRow:true },
    ticket:{ title:'שם האטרקציה', from:'מקום', to:'', start:'מועד כניסה', end:'', toRow:false, endRow:false },
    other: { title:'מה זה?', from:'מקום', to:'', start:'מועד', end:'', toRow:false, endRow:false }
  };
  return L[type] || L.other;
}
function tripApplyType(){
  var L = tripLabels(tripType);
  Array.prototype.forEach.call(document.querySelectorAll('#tripTypeRow .chip'), function(c){ c.classList.toggle('sel', c.getAttribute('data-type') === tripType); });
  tripEl('tripTitle').placeholder = L.title;
  tripEl('tripFrom').placeholder = L.from;
  tripEl('tripTo').placeholder = L.to;
  tripEl('tripToWrap').style.display = L.toRow ? '' : 'none';
  tripEl('tripEndWrap').style.display = L.endRow ? '' : 'none';
  tripSetText('tripStartLabel', L.start);
  tripSetText('tripEndLabel', L.end);
}
function tripResetForm(){
  tripEditId = null;
  ['tripTitle','tripFrom','tripTo','tripDate','tripTime','tripEndDate','tripEndTime','tripCode','tripNote'].forEach(function(id){ tripEl(id).value = ''; });
  tripEl('tripTz').value = 'ET'; tripEl('tripEndTz').value = 'ET';
  tripApplyType();
}
function tripOpenForm(){ tripEl('tripForm').classList.add('open'); }
function tripCloseForm(){ tripEl('tripForm').classList.remove('open'); tripResetForm(); }

function tripSaveItem(){
  var title = tripEl('tripTitle').value.trim(), date = tripEl('tripDate').value;
  if(!title){ tripToast('צריך לכתוב שם'); return; }
  if(!date){ tripToast('צריך לבחור תאריך'); return; }
  var L = tripLabels(tripType);
  var item = {
    id: tripEditId || (Date.now().toString(36) + Math.random().toString(36).slice(2,6)),
    type: tripType, title: title,
    from: tripEl('tripFrom').value.trim(), to: L.toRow ? tripEl('tripTo').value.trim() : '',
    date: date, time: tripEl('tripTime').value, tz: tripEl('tripTz').value,
    endDate: L.endRow ? tripEl('tripEndDate').value : '', endTime: L.endRow ? tripEl('tripEndTime').value : '', endTz: tripEl('tripEndTz').value,
    code: tripEl('tripCode').value.trim(), note: tripEl('tripNote').value.trim()
  };
  var t = tripS();
  if(tripEditId){ t.items = t.items.map(function(x){ return x.id === tripEditId ? item : x; }); }
  else t.items.push(item);
  tripCloseForm();
  tripSave();
  tripToast('נשמר');
}
function tripEditItem(it){
  tripType = it.type || 'other';
  tripApplyType();
  tripEditId = it.id;
  tripEl('tripTitle').value = it.title || ''; tripEl('tripFrom').value = it.from || ''; tripEl('tripTo').value = it.to || '';
  tripEl('tripDate').value = it.date || ''; tripEl('tripTime').value = it.time || ''; tripEl('tripTz').value = it.tz || 'ET';
  tripEl('tripEndDate').value = it.endDate || ''; tripEl('tripEndTime').value = it.endTime || ''; tripEl('tripEndTz').value = it.endTz || 'ET';
  tripEl('tripCode').value = it.code || ''; tripEl('tripNote').value = it.note || '';
  tripOpenForm();
  tripEl('tripForm').scrollIntoView({ block:'start' });
}

function tripLine(txt, cls){ var d = document.createElement('div'); d.className = cls || 'trip-line'; d.textContent = txt; return d; }
function tripOtherZoneText(it){
  if(!it.time) return '';
  var ms = tripToUTC(it.date, it.time, it.tz);
  var other = it.tz === 'IL' ? 'ET' : 'IL';
  var base = it.tz === 'IL' ? 'בארה״ב' : 'בישראל';
  var txt = tripFmtIn(ms, other, false);
  var dd = tripDayDiff(it.date, tripFmtDateIn(ms, other));
  return base + ': ' + txt + (dd > 0 ? ' (למחרת)' : (dd < 0 ? ' (יום קודם)' : ''));
}
function tripFmtDateIn(ms, tz){
  var parts = {};
  new Intl.DateTimeFormat('en-US', { timeZone: tripZone(tz), year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date(ms)).forEach(function(x){ parts[x.type] = x.value; });
  return parts.year + '-' + parts.month + '-' + parts.day;
}
function tripCard(it){
  var T = TRIP_TYPES[it.type] || TRIP_TYPES.other;
  var card = document.createElement('div'); card.className = 'trip-card';
  var head = document.createElement('div'); head.className = 'trip-head';
  var ico = document.createElement('span'); ico.className = 'trip-ico'; ico.textContent = T.ico;
  var ttl = document.createElement('div'); ttl.className = 'trip-title'; ttl.textContent = it.title;
  var ed = document.createElement('button'); ed.className = 'todo-del'; ed.type = 'button'; ed.textContent = '✎';
  ed.addEventListener('click', function(){ tripEditItem(it); });
  var del = document.createElement('button'); del.className = 'todo-del'; del.type = 'button'; del.textContent = '✕';
  del.addEventListener('click', function(){
    if(!confirm('למחוק את "' + it.title + '"?')) return;
    var t = tripS(); t.items = t.items.filter(function(x){ return x.id !== it.id; }); tripSave();
  });
  head.appendChild(ico); head.appendChild(ttl); head.appendChild(ed); head.appendChild(del);
  card.appendChild(head);
  var L = tripLabels(it.type);
  if(it.time) card.appendChild(tripLine(L.start + ': ' + it.time + ' · ' + tripZoneLabel(it.tz), 'trip-line strong'));
  var oz = tripOtherZoneText(it); if(oz) card.appendChild(tripLine(oz, 'trip-line soft'));
  if(it.from || it.to){
    card.appendChild(tripLine(it.type === 'flight' ? ((it.from || '?') + '  ←  ' + (it.to || '?')) : (it.to ? ('מ-' + it.from + ' ל-' + it.to) : it.from)));
  }
  if(it.endDate){
    var s = tripToUTC(it.date, it.time, it.tz), e = tripToUTC(it.endDate, it.endTime, it.endTz);
    var txt = L.end + ': ' + it.endDate.split('-').reverse().slice(0,2).join('/') + (it.endTime ? ' ' + it.endTime + ' · ' + tripZoneLabel(it.endTz) : '');
    if(it.type === 'flight' && it.time && it.endTime && e > s) txt += ' · משך ' + tripDurText(e - s);
    if(it.type === 'hotel'){ var n = tripDayDiff(it.date, it.endDate); if(n > 0) txt += ' · ' + n + (n === 1 ? ' לילה' : ' לילות'); }
    card.appendChild(tripLine(txt));
  }
  if(it.code) card.appendChild(tripLine('קוד הזמנה: ' + it.code, 'trip-line code'));
  if(it.note) card.appendChild(tripLine(it.note, 'trip-line soft'));
  return card;
}
function tripRenderTimeline(){
  var box = tripEl('tripTimeline'); if(!box) return;
  box.innerHTML = '';
  var items = tripSorted();
  if(!items.length){
    var em = document.createElement('div'); em.className = 'empty-msg'; em.textContent = 'עדיין אין פריטים. לחץ "+ פריט" והוסף טיסה, מלון או כרטיס.'; box.appendChild(em); return;
  }
  var first = items[0].date, today = tripTodayStr(), cur = null;
  items.forEach(function(it){
    if(it.date !== cur){
      cur = it.date;
      var d = tripDateParts(it.date);
      var h3 = document.createElement('div'); h3.className = 'trip-day' + (it.date === today ? ' today' : '');
      var n = tripDayDiff(first, it.date) + 1;
      h3.textContent = 'יום ' + TRIP_DAYS[d.getDay()] + ', ' + d.getDate() + ' ב' + TRIP_MONTHS[d.getMonth()] + ' · יום ' + n + (it.date === today ? ' · היום' : '');
      box.appendChild(h3);
    }
    box.appendChild(tripCard(it));
  });
}
function tripRenderNext(){
  var el = tripEl('tripNext'); if(!el) return;
  var items = tripSorted(), now = Date.now(), today = tripTodayStr();
  if(!items.length){ el.textContent = 'הוסף את הטיסה הראשונה כדי להתחיל'; return; }
  var upcoming = items.filter(function(it){ return (tripToUTC(it.date, it.time, it.tz) || 0) >= now; })[0];
  if(!upcoming){ el.textContent = 'כל הפריטים כבר עברו. טיול מוצלח היה! 🌴'; return; }
  var T = TRIP_TYPES[upcoming.type] || TRIP_TYPES.other;
  var ms = tripToUTC(upcoming.date, upcoming.time, upcoming.tz) - now;
  var pre = '';
  if(tripDayDiff(today, items[0].date) > 0) pre = 'הטיול מתחיל בעוד ' + tripDayDiff(today, items[0].date) + (tripDayDiff(today, items[0].date) === 1 ? ' יום' : ' ימים') + '. ';
  el.textContent = pre + 'הבא בתור: ' + T.ico + ' ' + upcoming.title + (upcoming.time ? ' (' + upcoming.time + ')' : '') + ' · בעוד ' + tripRemaining(ms);
}
function tripClocks(){
  var now = Date.now();
  tripSetText('tripClockNY', tripFmtIn(now, 'ET', false));
  tripSetText('tripClockIL', tripFmtIn(now, 'IL', false));
  var diff = Math.round((tripOffset(now, 'Asia/Jerusalem') - tripOffset(now, 'America/New_York'))/3600000);
  tripSetText('tripDiff', diff + ' שעות');
}
function tripRenderChecks(){
  var box = tripEl('tripChecks'); if(!box) return;
  box.innerHTML = '';
  var t = tripS();
  function row(text, done, onToggle, onDel){
    var r = document.createElement('div'); r.className = 'todo-item' + (done ? ' done' : '');
    var c = document.createElement('div'); c.className = 'todo-check'; c.textContent = done ? '✓' : '';
    var b = document.createElement('div'); b.className = 'todo-body';
    var x = document.createElement('div'); x.className = 'todo-text'; x.textContent = text;
    b.appendChild(x); r.appendChild(c); r.appendChild(b);
    r.addEventListener('click', onToggle);
    if(onDel){
      var d = document.createElement('button'); d.className = 'todo-del'; d.type = 'button'; d.textContent = '✕';
      d.addEventListener('click', function(ev){ ev.stopPropagation(); onDel(); });
      r.appendChild(d);
    }
    box.appendChild(r);
  }
  TRIP_CHECKS.forEach(function(text, k){
    row(text, !!t.checks['d'+k], function(){ t.checks['d'+k] = !t.checks['d'+k]; tripSave(); });
  });
  t.extra.forEach(function(ex){
    row(ex.text, !!ex.done, function(){ ex.done = !ex.done; tripSave(); }, function(){ t.extra = t.extra.filter(function(y){ return y.id !== ex.id; }); tripSave(); });
  });
}
function tripRender(){
  if(!tripEl('tripTimeline')) return;
  tripClocks(); tripRenderNext(); tripRenderTimeline(); tripRenderChecks();
}
function tripTile(){
  var el = tripEl('tileSumTrip'); if(!el) return;
  var items = tripSorted();
  if(!items.length){ el.textContent = 'הוסף טיסות ומלונות'; }
  else {
    var today = tripTodayStr(), first = items[0].date, last = items[items.length-1].endDate || items[items.length-1].date;
    var toStart = tripDayDiff(today, first);
    if(toStart > 0) el.textContent = 'עוד ' + toStart + (toStart === 1 ? ' יום' : ' ימים');
    else if(tripDayDiff(today, last) >= 0) el.textContent = 'יום ' + (tripDayDiff(first, today) + 1) + ' בטיול';
    else el.textContent = 'הטיול הסתיים';
  }
  tripRender();
}

Array.prototype.forEach.call(document.querySelectorAll('#tripTypeRow .chip'), function(c){
  c.addEventListener('click', function(){ tripType = c.getAttribute('data-type'); tripApplyType(); });
});
tripEl('tripAddBtn').addEventListener('click', function(){
  if(tripEl('tripForm').classList.contains('open')) tripCloseForm(); else { tripResetForm(); tripOpenForm(); }
});
tripEl('tripSaveBtn').addEventListener('click', tripSaveItem);
tripEl('tripCancelBtn').addEventListener('click', tripCloseForm);
tripEl('tripCheckAdd').addEventListener('click', function(){
  var v = tripEl('tripCheckInput').value.trim(); if(!v) return;
  tripS().extra.push({ id: Date.now().toString(36), text: v, done:false });
  tripEl('tripCheckInput').value = ''; tripSave();
});
tripEl('tripExportBtn').addEventListener('click', function(){
  var box = tripEl('tripBackupText'); box.value = JSON.stringify(tripS()); box.style.display = 'block'; box.focus(); box.select();
  tripToast('סמן והעתק את הטקסט');
});
tripEl('tripImportBtn').addEventListener('click', function(){
  var box = tripEl('tripBackupText');
  if(box.style.display === 'none' || !box.value.trim()){ box.value = ''; box.style.display = 'block'; box.focus(); tripToast('הדבק כאן טקסט טיול ולחץ שוב על ייבוא'); return; }
  var parsed; try{ parsed = JSON.parse(box.value); }catch(e){ tripToast('הטקסט לא תקין'); return; }
  if(!parsed || !Array.isArray(parsed.items)){ tripToast('זה לא נראה כמו טקסט טיול'); return; }
  if(!confirm('לייבא? זה יחליף את פרטי הטיול הקיימים.')) return;
  i.trip = { items: parsed.items, checks: parsed.checks || {}, extra: parsed.extra || [] };
  box.value = ''; box.style.display = 'none';
  tripSave(); tripToast('הטיול יובא');
});
tripApplyType();
setInterval(tripClocks, 30000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) tripRender(); });
try{ if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}

tripTile();
})();</script>
